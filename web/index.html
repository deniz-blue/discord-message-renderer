<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>discord-message-renderer</title>
		<link rel="icon" href="data:,">
		<link id="font" rel="stylesheet">
		<script type="module" src="./main.ts"></script>
	</head>
	<body>
		<header class="toolbar">
			<span class="title">discord-message-renderer</span>
			<label>Example <select id="example"></select></label>
			<label>Theme <select id="theme"></select></label>
			<label>Platform <select id="platform"></select></label>
			<label>Width <select id="width"></select></label>
			<span class="actions">
				<button id="embed" type="button">Copy embed code</button>
				<button id="copy" type="button">Copy PNG</button>
				<button id="download" type="button" class="primary">Download PNG</button>
			</span>
		</header>
		<main class="panes">
			<section class="editor-pane">
				<textarea id="editor" spellcheck="false" aria-label="Message JSON"></textarea>
				<p id="status" role="status"></p>
			</section>
			<section class="preview-pane">
				<div id="preview"></div>
			</section>
		</main>
	</body>
</html>
